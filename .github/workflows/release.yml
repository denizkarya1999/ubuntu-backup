name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate version and main ancestry
        run: |
          /usr/bin/python3 -c 'import os; from ubuntu_backup import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__'
          git merge-base --is-ancestor HEAD origin/main
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-apt dconf-cli xvfb desktop-file-utils
      - name: Run tests
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v
          /usr/bin/python3 tests/dconf_integration.py
          xvfb-run -a /usr/bin/python3 tests/gui_smoke.py
      - name: Build installer
        run: |
          /usr/bin/python3 build.py
          desktop-file-validate assets/ubuntu-backup.desktop
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --verify-tag --title "Ubuntu Backup $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
